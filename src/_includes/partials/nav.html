<header class="nav-bar visible" id="nav-bar">
    <div class="logo">
        <a class="logo-link" href="/">
            <picture>
                <source srcset="/images/icons/full-logo-white.svg" media="(prefers-color-scheme: dark)">
                <img src="/images/icons/full-logo.svg" alt="{{ navigation.logoAlt }}" width="100" height="70" fetchpriority="high">
            </picture>
        </a>

        <div class="mobile-nav">
            <a class="button nav" href="mailto:frank.kloos@fonetic.studio">{{ navigation.button }}</a>
            <button popovertarget="mobilepopover" class="hamburger" type="button">
                <img src="/images/icons/hamburger.svg" alt="{{ navigation.openAlt }}" width="50" height="50">
            </button>
        </div>

        <nav class="main-nav" id="mobilepopover" popover>
            <div class="mobile-menu-top">
                <button type="button" class="close-button" popovertarget="mobilepopover" popovertargetaction="hide" autofocus>
                    <img src="/images/icons/close-icon.svg" alt="{{ navigation.closeAlt }}" width="25" height="25">
                </button>
            </div>

            {% for link in navigation.links %}
                <a href="{{ link.href }}" class="nav-link">
                    {{ link.content }}
                    <div class="underline-deco"></div>
                </a>
            {% endfor %}

            <a class="button nav" href="mailto:frank.kloos@fonetic.studio">{{ navigation.button }}</a>
        </nav>
    </div>
</header>
